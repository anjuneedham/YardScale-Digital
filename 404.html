<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — YardScale Digital</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131313">
<link rel="icon" href="/brand/yardscale-mark-ink.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131313;--ink-2:#1c1c1a;--hair-dark:#2e2e2b;--paper:#f9f8f4;--paper-2:#efeee8;
  --hair:#dedbd2;--lime:#c3fc0f;--muted-dark:#8f8f86;--muted:#6b6b62;--soft:#d5d4cc;
  --display:'Archivo','Archivo Expanded',Helvetica Neue,Arial,sans-serif;
  --body:'Instrument Sans',-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --gutter:clamp(20px,5vw,64px);--maxw:860px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:2px}
::selection{background:var(--lime);color:var(--ink)}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:-.025em;font-variation-settings:'wdth' 116}
h1{font-size:clamp(2.3rem,8vw,4.2rem);line-height:.88}
h2{font-size:clamp(1.3rem,3.4vw,1.8rem);font-weight:700;font-variation-settings:'wdth' 112;margin:44px 0 14px}
h3{font-size:1.1rem;font-weight:700;margin:26px 0 8px}
p{margin:0 0 1em}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-dark);display:flex;align-items:center;gap:10px;margin:0 0 20px}
.tick{width:15px;height:11px;background:var(--lime);transform:skewX(-20deg);flex:none;display:inline-block}
header.nav{background:var(--ink);border-bottom:1px solid var(--hair-dark)}
.nav-in{max-width:1240px;margin-inline:auto;padding-inline:var(--gutter);display:flex;align-items:center;gap:20px;height:70px}
.nav-in img{height:28px;width:auto}
.nav-in a.back{margin-left:auto;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);text-decoration:none;opacity:.75}
.nav-in a.back:hover{opacity:1;color:var(--lime)}
.top{background:var(--ink);color:var(--paper);padding:clamp(46px,8vw,86px) 0 clamp(40px,6vw,66px)}
.top p.lead{color:var(--soft);max-width:48ch;margin:22px 0 0;font-size:clamp(1.02rem,2vw,1.2rem);line-height:1.5}
main.doc{padding:clamp(44px,7vw,80px) 0 clamp(60px,9vw,110px)}
main.doc p,main.doc li{color:#3b3b35}
main.doc ul{padding-left:20px;display:grid;gap:8px;margin:0 0 1em}
.meta{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 30px}
.empty{border:1px dashed var(--hair);padding:clamp(26px,4vw,40px);background:var(--paper-2)}
.empty h2{margin-top:0}
.empty p{margin-bottom:0;color:#3b3b35}
.post{border-top:1px solid var(--hair);padding:26px 0}
.post:last-of-type{border-bottom:1px solid var(--hair)}
.post .d{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.post h2{margin:0 0 8px;font-size:clamp(1.25rem,3.2vw,1.65rem)}
.post p{margin:0}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;text-decoration:none;font-family:var(--mono);font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;font-weight:500;border:1px solid transparent;border-radius:2px;transition:transform .18s,border-color .18s,color .18s}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{transform:translateY(-2px)}
.btn-outline{border-color:var(--hair);color:var(--ink)}
.btn-outline:hover{border-color:var(--ink)}
footer{border-top:1px solid var(--hair-dark);background:var(--ink);color:var(--paper);padding:30px 0}
.foot-in{max-width:1240px;margin-inline:auto;padding-inline:var(--gutter);display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.foot-in a,.foot-in span{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-dark);text-decoration:none}
.foot-in a:hover{color:var(--lime)}
.foot-in a{display:inline-flex;align-items:center;min-height:44px}
.foot-in .sp{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap}
@media(max-width:600px){body{font-size:16px}.foot-in .sp{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
.top{min-height:60vh;display:flex;align-items:center}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-in">
    <a href="/" aria-label="YardScale Digital, home"><img src="/brand/yardscale-lockup-ink.png" alt="YardScale Digital" width="760" height="156"></a>
    <a class="back" href="/">← Back to the studio</a>
  </div>
</header>
<section class="top">
  <div class="wrap">
    <p class="eyebrow"><span class="tick"></span> 404</p>
    <h1>Nothing<br>here</h1>
    <p class="lead">That page doesn't exist, or it moved. The studio, AgriLoop and the build log are all one scroll away.</p>
    <p style="margin-top:30px;display:flex;flex-wrap:wrap;gap:12px">
      <a class="btn btn-ink" style="background:var(--lime);color:var(--ink)" href="/">Back to the studio <span>→</span></a>
      <a class="btn" style="border-color:var(--hair-dark);color:var(--paper)" href="/#agriloop">Explore AgriLoop</a>
    </p>
  </div>
</section>
<footer>
  <div class="foot-in">
    <span>© <span id="yr">2026</span> YardScale Digital</span>
    <div class="sp">
      <a href="/#agriloop">AgriLoop</a>
      <a href="/journal">Journal</a>
      <a href="/#build-log">Build log</a>
      <a href="/privacy">Privacy</a>
      <a href="mailto:yardscaledigital@gmail.com">Email</a>
    </div>
  </div>
</footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body>
</html>
