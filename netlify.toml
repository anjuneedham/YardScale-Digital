[build]
  publish = "."
  command = "bash ./build.sh"
  functions = "netlify/functions"

# ─────────── security + sane defaults ───────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# HTML is always revalidated, so a redeploy is live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are content-stable — cache them hard.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# ─────────── tidy URLs ───────────
[[redirects]]
  from = "/journal"
  to = "/journal.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/agriloop"
  to = "/#agriloop"
  status = 302

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 302

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 302

[[redirects]]
  from = "/newsletter"
  to = "/#build-log"
  status = 302

# The old agency site's booking entry point, kept so existing links land somewhere.
[[redirects]]
  from = "/book"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
